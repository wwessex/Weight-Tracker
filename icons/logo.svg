<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Syringe icon for Jab It logo -->
  <g transform="rotate(-35 100 100)">
    <!-- Plunger handle -->
    <rect x="78" y="8" width="44" height="10" rx="5" fill="#14b8a6"/>
    <!-- Plunger rod -->
    <rect x="94" y="18" width="12" height="26" rx="2" fill="#14b8a6"/>
    <!-- Barrel -->
    <rect x="78" y="44" width="44" height="80" rx="6" stroke="#14b8a6" stroke-width="7" fill="none"/>
    <!-- Fluid fill (partial) -->
    <rect x="82" y="82" width="36" height="38" rx="3" fill="#14b8a6" opacity="0.2"/>
    <!-- Measurement lines -->
    <line x1="83" y1="64" x2="104" y2="64" stroke="#14b8a6" stroke-width="4" stroke-linecap="round"/>
    <line x1="83" y1="82" x2="104" y2="82" stroke="#14b8a6" stroke-width="4" stroke-linecap="round"/>
    <line x1="83" y1="100" x2="104" y2="100" stroke="#14b8a6" stroke-width="4" stroke-linecap="round"/>
    <!-- Needle connector -->
    <rect x="88" y="124" width="24" height="14" rx="2" fill="#14b8a6"/>
    <!-- Needle -->
    <line x1="100" y1="138" x2="100" y2="185" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
