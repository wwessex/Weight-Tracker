name: Build Static Site Zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site artifact directory
        run: |
          mkdir -p site-artifact
          cp -r index.html manifest.json sw.js css js icons site-artifact/

      - name: Upload site files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: weight-tracker-site
          path: site-artifact/
