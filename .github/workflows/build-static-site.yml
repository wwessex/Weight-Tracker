name: Build Static Site Zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE_URL: https://wwessex.github.io/Weight-Tracker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release metadata consistency
        run: |
          python3 scripts/release_check.py \
            --base-url "$SITE_BASE_URL"

      - name: Prepare site artifact directory
        run: |
          mkdir -p site-artifact
          cp -r index.html manifest.json robots.txt sitemap.xml sw.js css js icons site-artifact/

      - name: Upload site files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: weight-tracker-site
          path: site-artifact/
