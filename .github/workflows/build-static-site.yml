name: Build Static Site Zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create site zip
        run: zip -r site.zip index.html manifest.json sw.js css/ js/ icons/

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: weight-tracker-site
          path: site.zip
