name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    env:
      SITE_BASE_URL: https://wwessex.github.io/Weight-Tracker
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Sync sitemap lastmod + validate release metadata
        run: |
          DEPLOY_DATE="$(date -u +%F)"
          python3 scripts/release_check.py \
            --base-url "$SITE_BASE_URL" \
            --date "$DEPLOY_DATE" \
            --write-lastmod

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
